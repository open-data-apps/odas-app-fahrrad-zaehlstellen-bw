<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7eb8f7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3d3fa5;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg-grad)"/>

  <g filter="url(#shadow)" fill="none" stroke="white" stroke-width="22"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="155" cy="330" r="80"/>
    <circle cx="357" cy="330" r="80"/>
    <polyline points="155,330 215,200 290,200 357,330"/>
    <polyline points="215,200 155,330"/>
    <line x1="256" y1="200" x2="357" y2="330"/>
    <line x1="185" y1="205" x2="245" y2="205"/>
    <line x1="270" y1="200" x2="310" y2="185"/>
    <line x1="295" y1="185" x2="330" y2="185"/>
  </g>

  <polyline points="330,110 370,80 410,110" fill="none"
            stroke="white" stroke-width="16" stroke-linecap="round"
            stroke-linejoin="round" opacity="0.85"/>
  <line x1="370" y1="80" x2="370" y2="145" stroke="white"
        stroke-width="16" stroke-linecap="round" opacity="0.85"/>
</svg>
